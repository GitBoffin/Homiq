<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Homiq Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0A;--bg2:#111;--bg3:#181818;--bg4:#222;--bg5:#2C2C2C;
  --br:#242424;--br2:#2E2E2E;
  --gold:#C49A52;--gold2:#DDB46A;--goldl:rgba(196,154,82,.1);--goldb:rgba(196,154,82,.25);
  --green:#22C55E;--greenl:rgba(34,197,94,.08);--greenb:rgba(34,197,94,.25);
  --red:#F05252;--redl:rgba(240,82,82,.08);--redb:rgba(240,82,82,.25);
  --blue:#4F8EF7;--bluel:rgba(79,142,247,.08);--blueb:rgba(79,142,247,.25);
  --amber:#F59E0B;--amberl:rgba(245,158,11,.08);--amberb:rgba(245,158,11,.25);
  --ink:#EDEAE4;--ink2:#B0ACA6;--ink3:#706C68;--ink4:#454240;
  --r:8px;--r2:12px;--r3:16px;--r4:20px;
  --nav-w:230px;
}
html,body{height:100%;font-family:'Sora',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:'Sora',sans-serif;}
button{cursor:pointer;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--br2);border-radius:2px;}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;}
.lc{width:100%;max-width:340px;}
.lc-top{text-align:center;margin-bottom:28px;}
.lc-logo{font-family:'DM Mono',monospace;font-size:26px;letter-spacing:3px;color:var(--gold);}
.lc-sub{font-size:10px;color:var(--ink3);letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
.lc-box{background:var(--bg2);border:1px solid var(--br2);border-radius:var(--r4);padding:28px 24px;}
.lc-err{background:var(--redl);border:1px solid var(--redb);border-radius:var(--r);padding:9px 12px;font-size:12px;color:var(--red);margin-bottom:14px;display:none;}
.flbl{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);margin-bottom:5px;display:block;}
.finp{width:100%;background:var(--bg3);border:1px solid var(--br2);border-radius:var(--r);padding:11px 13px;font-size:13px;color:var(--ink);outline:none;transition:border .2s;margin-bottom:14px;}
.finp:focus{border-color:var(--gold);}
.lc-btn{width:100%;background:var(--gold);border:none;border-radius:var(--r);padding:12px;font-size:13px;font-weight:700;color:#fff;letter-spacing:.3px;transition:opacity .15s;}
.lc-btn:hover{opacity:.9;}

/* APP */
#app{display:none;height:100vh;overflow:hidden;}

/* SIDEBAR */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);background:var(--bg2);border-right:1px solid var(--br);display:flex;flex-direction:column;z-index:200;transition:transform .25s cubic-bezier(.4,0,.2,1);}
.sb-head{padding:16px 14px 12px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:10px;}
.sb-mark{width:32px;height:32px;background:var(--goldl);border:1px solid var(--goldb);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-mark span{font-family:'DM Mono',monospace;font-size:13px;color:var(--gold);}
.sb-name{font-size:12px;font-weight:700;color:var(--ink);}
.sb-role{font-size:9px;color:var(--ink4);text-transform:uppercase;letter-spacing:1px;}
.sb-nav{flex:1;overflow-y:auto;padding:6px 8px;}
.sb-sec{font-size:9px;font-weight:600;color:var(--ink4);letter-spacing:1.5px;text-transform:uppercase;padding:10px 8px 3px;}
.ni{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);font-size:12px;font-weight:500;color:var(--ink3);background:none;border:none;width:100%;text-align:left;transition:all .12s;margin-bottom:1px;position:relative;}
.ni:hover{background:var(--bg3);color:var(--ink);}
.ni.on{background:var(--goldl);color:var(--gold);font-weight:600;}
.ni svg{width:14px;height:14px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8;}
.ni.on svg{opacity:1;}
.ni-badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;padding:1px 5px;font-size:9px;font-weight:700;}
.sb-foot{padding:6px 8px;border-top:1px solid var(--br);}
.sb-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:190;}

/* MAIN */
.main{margin-left:var(--nav-w);height:100vh;overflow-y:auto;background:var(--bg);}
.mob-bar{display:none;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--bg2);border-bottom:1px solid var(--br);position:sticky;top:0;z-index:100;}
.mob-menu{background:var(--bg3);border:1px solid var(--br2);border-radius:var(--r);padding:6px;display:flex;align-items:center;}
.mob-menu svg{width:15px;height:15px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;}
.mob-logo{font-family:'DM Mono',monospace;font-size:13px;color:var(--gold);letter-spacing:2px;}
.pg{padding:20px 22px;max-width:1180px;}

/* TOPBAR */
.tb{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:10px;flex-wrap:wrap;}
.tb-l .ttl{font-size:18px;font-weight:800;letter-spacing:-.3px;}
.tb-l .sub{font-size:11px;color:var(--ink3);margin-top:2px;}
.tb-r{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}

/* STATS */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.sc{background:var(--bg2);border:1px solid var(--br);border-radius:var(--r2);padding:14px 16px;}
.sc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.sc-lbl{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);}
.sc-ico{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
.sc-ico svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.sc-val{font-size:24px;font-weight:700;font-family:'DM Mono',monospace;line-height:1;}
.sc-sub{font-size:10px;color:var(--ink4);margin-top:3px;}
.ico-g{background:var(--goldl);color:var(--gold);}
.ico-gr{background:var(--greenl);color:var(--green);}
.ico-r{background:var(--redl);color:var(--red);}
.ico-b{background:var(--bluel);color:var(--blue);}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--br);border-radius:var(--r2);overflow:hidden;margin-bottom:16px;}
.ch{padding:12px 16px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;}
.ch-t{font-size:12px;font-weight:700;}
.cb{padding:14px 16px;}

/* TABLE */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;}
th{background:var(--bg3);padding:8px 12px;text-align:left;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);white-space:nowrap;}
td{padding:9px 12px;border-top:1px solid var(--br);font-size:12px;vertical-align:middle;}
tr:hover td{background:var(--bg3);}
.mono{font-family:'DM Mono',monospace;font-size:11px;}

/* BADGES */
.bge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;line-height:1.7;}
.bge-g{background:var(--goldl);color:var(--gold);border:1px solid var(--goldb);}
.bge-gr{background:var(--greenl);color:var(--green);border:1px solid var(--greenb);}
.bge-r{background:var(--redl);color:var(--red);border:1px solid var(--redb);}
.bge-b{background:var(--bluel);color:var(--blue);border:1px solid var(--blueb);}
.bge-a{background:var(--amberl);color:var(--amber);border:1px solid var(--amberb);}
.bge-gy{background:var(--bg4);color:var(--ink3);border:1px solid var(--br2);}

/* ACTION BTNS */
.ab{background:var(--bg4);border:1px solid var(--br2);border-radius:6px;padding:3px 9px;font-size:10px;font-weight:600;color:var(--ink2);transition:all .12s;white-space:nowrap;}
.ab:hover{border-color:var(--gold);color:var(--gold);}
.ab-r{color:var(--red);}
.ab-r:hover{background:var(--redl);border-color:var(--redb);}
.ab-gr{color:var(--green);}
.ab-gr:hover{background:var(--greenl);border-color:var(--greenb);}
.ab-p{background:var(--goldl);border-color:var(--goldb);color:var(--gold);}
.acts{display:flex;gap:4px;flex-wrap:wrap;}

/* SEARCH */
.sw{position:relative;}
.sw svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:12px;height:12px;stroke:var(--ink3);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none;}
.si{background:var(--bg3);border:1px solid var(--br2);border-radius:var(--r);padding:7px 10px 7px 28px;font-size:11px;color:var(--ink);outline:none;transition:border .2s;width:220px;}
.si:focus{border-color:var(--gold);}
.fsel{background:var(--bg3);border:1px solid var(--br2);border-radius:var(--r);padding:7px 10px;font-size:11px;color:var(--ink2);outline:none;}
.btn-s{background:var(--bg3);border:1px solid var(--br2);border-radius:var(--r);padding:6px 12px;font-size:11px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:5px;transition:all .12s;}
.btn-s:hover{border-color:var(--gold);color:var(--gold);}
.btn-s svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--bg3);border-radius:var(--r);padding:3px;margin-bottom:14px;width:fit-content;}
.tab{padding:6px 14px;border-radius:6px;font-size:11px;font-weight:600;color:var(--ink3);background:none;border:none;transition:all .12s;}
.tab.on{background:var(--bg2);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.4);}

/* MODAL */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:600;display:none;align-items:flex-end;justify-content:center;}
.mov.on{display:flex;}
.mbox{background:var(--bg2);border:1px solid var(--br2);border-radius:var(--r4) var(--r4) 0 0;width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column;}
.mhead{padding:16px 20px 12px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2);z-index:5;border-radius:var(--r4) var(--r4) 0 0;}
.mtitle{font-size:14px;font-weight:700;}
.mx{background:var(--bg4);border:1px solid var(--br2);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink3);}
.mbody{padding:18px 20px;overflow-y:auto;flex:1;}
.mfoot{padding:12px 20px;border-top:1px solid var(--br);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--bg2);}
.mb_{padding:8px 18px;border-radius:var(--r);font-size:11px;font-weight:700;border:none;transition:opacity .12s;}
.mb_:hover{opacity:.85;}
.mb-p{background:var(--gold);color:#fff;}
.mb-s{background:var(--bg4);color:var(--ink2);border:1px solid var(--br2);}
.mb-d{background:var(--redl);color:var(--red);border:1px solid var(--redb);}

/* MODAL FIELDS */
.mf{margin-bottom:12px;}
.ml_{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);margin-bottom:4px;display:block;}
.mi_{width:100%;background:var(--bg3);border:1px solid var(--br2);border-radius:var(--r);padding:9px 11px;font-size:12px;color:var(--ink);outline:none;}
.mi_:focus{border-color:var(--gold);}

/* INFO ROWS */
.ir{display:flex;padding:7px 0;border-bottom:1px solid var(--br);}
.ik{font-size:10px;color:var(--ink3);min-width:120px;flex-shrink:0;padding-top:1px;}
.iv{font-size:12px;color:var(--ink);font-weight:500;flex:1;}
.sec-lbl{font-size:9px;font-weight:700;color:var(--ink4);letter-spacing:2px;text-transform:uppercase;margin:14px 0 8px;}

/* PROFILE HEADER */
.ph{background:linear-gradient(135deg,var(--bg3),var(--goldl));border-radius:var(--r2);padding:16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}
.pav{width:48px;height:48px;border-radius:50%;background:var(--goldl);border:1.5px solid var(--goldb);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--gold);flex-shrink:0;overflow:hidden;}
.pav img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.pn{font-size:15px;font-weight:800;}
.pc{font-size:10px;color:var(--ink3);margin-top:2px;}
.pbadges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}

/* MINI CARDS */
.mc{background:var(--bg3);border:1px solid var(--br);border-radius:var(--r);padding:9px 11px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.mc-t{font-size:11px;font-weight:600;color:var(--ink);}
.mc-s{font-size:9px;color:var(--ink3);margin-top:2px;}
.mc-r{text-align:right;flex-shrink:0;}
.mc-p{font-size:11px;font-weight:700;color:var(--green);font-family:'DM Mono',monospace;}
.mc-d{font-size:9px;color:var(--ink4);margin-top:1px;}

/* PAY ROW */
.pr{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--br);gap:8px;}
.pr-t{font-size:11px;font-weight:600;}
.pr-ref{font-size:9px;color:var(--ink4);font-family:'DM Mono',monospace;}
.pr-amt{font-size:12px;font-weight:700;color:var(--green);font-family:'DM Mono',monospace;flex-shrink:0;}

/* ACTIVITY */
.ai{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--br);}
.ad{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.at{font-size:11px;color:var(--ink2);flex:1;line-height:1.5;}
.ats{font-size:9px;color:var(--ink4);flex-shrink:0;margin-top:2px;}

/* UTILS */
.tg{color:var(--gold);}
.tgr{color:var(--green);}
.tr_{color:var(--red);}
.td_{color:var(--ink4);}
.tw_{font-weight:700;}
.trunc{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;}
.div{height:1px;background:var(--br);margin:12px 0;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.empty{text-align:center;padding:36px 20px;color:var(--ink3);}
.empty svg{width:28px;height:28px;stroke:var(--ink4);fill:none;stroke-width:1.5;stroke-linecap:round;margin-bottom:10px;}
.empty p{font-size:11px;}
.loading{text-align:center;padding:40px;}
.spin{width:18px;height:18px;border:2px solid var(--br2);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 8px;}
@keyframes spin{to{transform:rotate(360deg)}}
.ldot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* TOAST */
#toast{position:fixed;bottom:18px;right:18px;z-index:9999;display:none;}
.ti{padding:10px 14px;border-radius:var(--r2);font-size:11px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.4);}
.ti-ok{background:var(--bg3);border:1px solid var(--greenb);color:var(--green);}
.ti-er{background:var(--bg3);border:1px solid var(--redb);color:var(--red);}
#toast.sh{display:block;animation:tf .18s ease;}
@keyframes tf{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* RESPONSIVE */
@media(max-width:800px){
  :root{--nav-w:0px;}
  .sidebar{transform:translateX(-100%);width:230px;}
  .sidebar.open{transform:translateX(0);}
  .sb-ov.sh{display:block;}
  .main{margin-left:0;}
  .mob-bar{display:flex;}
  .pg{padding:14px 14px;}
  .sg{grid-template-columns:1fr 1fr;}
  .two-col{grid-template-columns:1fr;}
  .si{width:160px;}
  .hm{display:none!important;}
}
@media(max-width:480px){
  .sg{grid-template-columns:1fr 1fr;}
  .sc-val{font-size:20px;}
  .si{width:130px;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="lc">
    <div class="lc-top">
      <div class="lc-logo">HOMIQ</div>
      <div class="lc-sub">Admin Control Panel</div>
    </div>
    <div class="lc-box">
      <div class="lc-err" id="lc-err">Wrong password. Try again.</div>
      <label class="flbl">Master Password</label>
      <input class="finp" type="password" id="lc-pass" placeholder="Enter admin password" autocomplete="current-password"/>
      <button class="lc-btn" onclick="doLogin()">Enter Dashboard →</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="sb-ov" id="sb-ov" onclick="closeSB()"></div>

  <div class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-mark"><span>H</span></div>
      <div><div class="sb-name">Homiq</div><div class="sb-role">Admin Panel</div></div>
    </div>
    <nav class="sb-nav">
      <div class="sb-sec">Overview</div>
      <button class="ni on" data-s="dashboard" onclick="go('dashboard')">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard
      </button>
      <div class="sb-sec">Manage</div>
      <button class="ni" data-s="users" onclick="go('users')">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>Users
      </button>
      <button class="ni" data-s="listings" onclick="go('listings')">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Rent Listings
      </button>
      <button class="ni" data-s="buysell" onclick="go('buysell')">
        <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>Buy / Sell
      </button>
      <button class="ni" data-s="connect" onclick="go('connect')">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>HomiqConnect
        <span class="ni-badge" id="conn-badge" style="display:none">0</span>
      </button>
      <button class="ni" data-s="jobs" onclick="go('jobs')">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>Jobs
      </button>
      <button class="ni" data-s="services" onclick="go('services')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>HomiqServices
      </button>
      <div class="sb-sec">Finance & Safety</div>
      <button class="ni" data-s="notifications" onclick="go('notifications')">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>Notifications
      </button>
      <button class="ni" data-s="payments" onclick="go('payments')">
        <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Payments
      </button>
      <button class="ni" data-s="referrals" onclick="go('referrals')">
        <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Referrals
        <span class="ni-badge" id="ref-badge" style="display:none">0</span>
      </button>
      <button class="ni" data-s="reports" onclick="go('reports')">

async function sbQ(method,table,query,body){
  try{
    const _h=Object.assign({},SB_H);
    if(method==='GET'||method==='DELETE') delete _h['Prefer'];
    const r=await fetch(SB_URL+'/rest/v1/'+table+(query||''),{method,headers:_h,body:body?JSON.stringify(body):undefined});
    if(!r.ok){console.error('DB',method,table,r.status,await r.text());return null;}
    if(method==='DELETE')return true;
    const t=await r.text(); return t?JSON.parse(t):[];
  }catch(e){console.error(e);return null;}
}
const DB={
  get:(t,q)=>sbQ('GET',t,q),
  ins:(t,d)=>sbQ('POST',t,'',d),
  upd:(t,id,d)=>sbQ('PATCH',t,'?id=eq.'+id,d),
  del:(t,id)=>sbQ('DELETE',t,'?id=eq.'+id),
  delWhere:(t,q)=>sbQ('DELETE',t,q),
};

function ago(iso){
  if(!iso)return '—';
  const s=(Date.now()-new Date(iso))/1000;
  if(s<60)return 'Just now';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<604800)return Math.floor(s/86400)+'d ago';
  return ds(iso);
}

// helper — filter array by state key matching city or state field
function filterByStateKey(arr, stateKey){

      </select>

async function applyBadge(uid){
  const sel=document.getElementById('b-sel'); if(!sel)return;
  const t=sel.value, u=D.users.find(x=>x.id===uid); if(!u)return;
  const e30=new Date(Date.now()+30*24*3600000).toISOString();
  const e48=new Date(Date.now()+48*3600000).toISOString();
  let upd={};
  if(t==='agent') upd={is_agent:true,role:'agent',agent_expires:e30};
  else if(t==='store_gadget') upd={store_type:'gadget',store_expires:e30};
  else if(t==='store_electronics') upd={store_type:'electronics',store_expires:e30};
  else if(t==='pro') upd={has_svc_listing:true,svc_expires:e30};
  else if(t==='shortlet_pro') upd={shortlet_pro:true,shortlet_pro_expires:e30};
  else if(t==='boost_listing'){
    const li=D.listings.find(x=>x.poster_id===uid&&!x.is_top);
    if(li){const br=await DB.upd('listing',li.id,{is_top:true,boost_expires:e48});if(br){li.is_top=true;toast('⚡ Listing boosted','ok');cM();rUsers();}else toast('Failed','err');}
    else toast('No unboosted listing found','err');
    return;
  }
  else if(t==='remove') upd={is_agent:false,agent_expires:null,store_type:null,store_expires:null,has_svc_listing:false,shortlet_pro:false,shortlet_pro_expires:null};
  if(!Object.keys(upd).length)return;
  const r=await DB.upd('user',uid,upd);
  if(r){Object.assign(u,upd);toast('✓ Badge applied','ok');cM();rUsers();}
  else toast('Failed — check Supabase RLS','err');
}
async function delUser(uid,name){
  if(!confirm('Delete user "'+name+'"? Cannot be undone.'))return;
  await DB.del('user',uid);
  D.users=D.users.filter(x=>x.id!==uid);
  toast('User deleted','ok'); rUsers();
}

async function boostItem(id,table){
  const bsAll=[...D.bs_appliances,...D.bs_houses,...D.bs_land];
  const src=table==='listing'?D.listings:table==='bs_listing'?bsAll:D.jobs;
  const item=src.find(x=>x.id===id); if(!item)return;
  const exp=new Date(Date.now()+48*3600000).toISOString();
  const upd=table==='bs_listing'?{is_featured:true}:{is_top:true,boost_expires:exp};
  const r=await DB.upd(table,id,upd);
  if(r){
    if(table==='bs_listing')item.is_featured=true; else{item.is_top=true;item.boost_expires=exp;}
    toast('Boosted!','ok');
    if(table==='listing')rListings(); else if(table==='bs_listing')rBuySell(); else rJobs();
  } else toast('Failed','err');
}
async function delListing(id,table){
  if(!confirm('Delete this listing? Cannot be undone.'))return;
  const r=await DB.del(table,id);
  if(r){
    if(table==='listing') D.listings=D.listings.filter(x=>x.id!==id);
    else if(table==='bs_listing'){
      D.bs_appliances=D.bs_appliances.filter(x=>x.id!==id);
      D.bs_houses=D.bs_houses.filter(x=>x.id!==id);
      D.bs_land=D.bs_land.filter(x=>x.id!==id);
    } else D.jobs=D.jobs.filter(x=>x.id!==id);
    toast('Deleted','ok');
    if(table==='listing')rListings(); else if(table==='bs_listing')rBuySell(); else rJobs();
  } else toast('Failed to delete','err');
}

async function sendNotification(){
  const type  = document.getElementById('n-type')?.value;
  const state = document.getElementById('n-state')?.value;
  const title = document.getElementById('n-title')?.value.trim();
  const body  = document.getElementById('n-body')?.value.trim();
  const actionLabel = document.getElementById('n-action-label')?.value.trim();
  const actionUrl   = document.getElementById('n-action-url')?.value.trim();

  if(!title){toast('Title is required','err');return;}
  if(!body){toast('Message body is required','err');return;}

  const notif = {
    id: 'notif_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    type,
    title,
    body,
    user_id: null, // null = broadcast to all
    city: state||null,
    action_label: actionLabel||null,
    action_url: actionUrl||null,
    read_by: [],
    created_at: new Date().toISOString(),
  };

  const r = await DB.ins('notifications', notif);
  if(r){
    D.notifications.unshift(Array.isArray(r)?r[0]:r);
    toast('✓ Notification sent to '+(state?STATES.find(s=>s.key===state)?.label:'All States'),'ok');
    cM(); rNotifications();
  } else {
    toast('Failed to send — check Supabase notifications table exists','err');
  }
}

async function delNotif(id){
  if(!confirm('Delete this notification? Users who haven\'t read it won\'t see it.'))return;
  const r=await DB.del('notifications',id);
  if(r){D.notifications=D.notifications.filter(x=>x.id!==id);toast('Deleted','ok');rNotifications();}
  else toast('Failed','err');
}

          <td class="tgr mono">${fmt((p.amount||0)/100)}</td>
          <td class="mono td_ hm"><span class="trunc" style="max-width:160px">${esc(p.ref||'—')}</span></td>
          <td class="td_ hm">${ds(p.created_at)}</td>
          <td><button class="ab ab-gr" onclick="fixPayModal('${p.user_id}','${p.id}','${p.type}','${p.amount}')">Fix</button></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div></div>`);
}
function fixPayModal(uid,payId,type,amount){
  const u=D.users.find(x=>x.id===uid);
  oM('Fix Payment',`
    <p style="font-size:11px;color:var(--ink2);line-height:1.6;margin-bottom:14px">
      ${u?'User <strong>'+esc(u.nick||'+234'+(u.phone||''))+'</strong>':'Unknown user'}${type?' paid for <strong>'+esc((type||'').replace(/_/g,' '))+'</strong> ('+fmt((amount||0)/100)+') but may not have received it.':' — manually apply a benefit.'}
    </p>
    <div class="mf"><label class="ml_">What to apply</label>
      <select class="mi_" id="fix-sel">
        <option value="agent">Give Verified Agent (30 days)</option>
        <option value="store_gadget">Give Verified Store — Gadget</option>
        <option value="store_electronics">Give Verified Store — Electronics</option>
        <option value="pro">Give Verified Pro</option>
        <option value="boost">Boost their latest rent listing</option>
      </select>
    </div>
    <p style="font-size:10px;color:var(--ink4)">Applies immediately to the user account.</p>
  `,`<button class="mb_ mb-s" onclick="cM()">Cancel</button>
     <button class="mb_ mb-p" onclick="applyFix('${uid}')">Apply Fix</button>`);
}
async function applyFix(uid){
  const sel=document.getElementById('fix-sel'); if(!sel)return;
  const t=sel.value, u=D.users.find(x=>x.id===uid); if(!u)return;
  const e30=new Date(Date.now()+30*24*3600000).toISOString();
  let upd={};
  if(t==='agent') upd={is_agent:true,role:'agent',agent_expires:e30};
  else if(t==='store_gadget') upd={store_type:'gadget',store_expires:e30};
  else if(t==='store_electronics') upd={store_type:'electronics',store_expires:e30};
  else if(t==='pro') upd={has_svc_listing:true};
  else if(t==='boost'){
    const l=D.listings.find(x=>x.poster_id===uid&&!x.is_top);
    if(l){await DB.upd('listing',l.id,{is_top:true,boost_expires:new Date(Date.now()+48*3600000).toISOString()});l.is_top=true;}
    else{toast('No unboosted listing found','err');return;}
  }
  if(Object.keys(upd).length){
    const r=await DB.upd('user',uid,upd);
    if(!r){toast('Failed','err');return;}
    Object.assign(u,upd);
  }
  toast('Fix applied to '+esc(u.nick||u.phone||'user'),'ok');
  cM(); rPayments();
}

// ══════════════════════════
// REPORTS
// ══════════════════════════
let _rt='open';
function rReports(){
  const open=D.reports.filter(r=>!r.resolved);
  const done=D.reports.filter(r=>r.resolved);
  setP(`
  <div class="tb">
    <div class="tb-l"><div class="ttl">Reports</div><div class="sub">${open.length} open · ${done.length} resolved</div></div>
    <button class="btn-s" onclick="loadAll().then(()=>rReports())"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>Refresh</button>
  </div>
  <div class="tabs">
    <button class="tab ${_rt==='open'?'on':''}" onclick="_rt='open';drawRepTable()">Open (${open.length})</button>
    <button class="tab ${_rt==='done'?'on':''}" onclick="_rt='done';drawRepTable()">Resolved (${done.length})</button>
  </div>
  <div id="rt"></div>`);
  drawRepTable();
}
function drawRepTable(){
  document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('on',(i===0&&_rt==='open')||(i===1&&_rt==='done'));});
  const bsAll=[...D.bs_appliances,...D.bs_houses,...D.bs_land];
  const data=_rt==='open'?D.reports.filter(r=>!r.resolved):D.reports.filter(r=>r.resolved);
  const el=document.getElementById('rt'); if(!el)return;
  if(!data.length){el.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><p>Nothing here</p></div>';return;}
  el.innerHTML=`<div class="card"><div class="tw"><table>
    <thead><tr><th>Listing</th><th>Report Type</th><th class="hm">Reporter</th><th class="hm">Date</th><th>Actions</th></tr></thead>
    <tbody>
    ${data.map(r=>{
      const l=[...D.listings,...bsAll,...D.jobs].find(x=>x.id===r.listing_id);
      const rep=D.users.find(u=>u.id===r.reporter_id);
      const tbl=D.listings.find(x=>x.id===r.listing_id)?'listing':bsAll.find(x=>x.id===r.listing_id)?'bs_listing':'job_listing';
      return`<tr>
        <td>
          <div class="tw_" style="font-size:12px">${l?esc(l.area||l.title||'Listing'):'Deleted'}</div>
          <div class="mono td_" style="font-size:9px">${(r.listing_id||'').substring(0,18)}</div>
        </td>
        <td><span class="bge bge-r">${esc(r.report_type||'—')}</span></td>
        <td class="hm">${esc(rep?rep.nick||'+234'+(rep.phone||''):'Anonymous')}</td>
        <td class="td_ hm">${ago(r.created_at)}</td>
        <td><div class="acts">
          ${!r.resolved?`<button class="ab ab-gr" onclick="resolveRep('${r.id}')">Resolve</button>`:'<span class="td_" style="font-size:10px">✓</span>'}
          ${l?`<button class="ab ab-r" onclick="delListing('${l.id}','${tbl}')">Del Post</button>`:''}
        </div></td>
      </tr>`;
    }).join('')}
    </tbody></table></div></div>`;
}
async function resolveRep(id){
  const rep=D.reports.find(y=>String(y.id)===String(id));
  if(!rep){toast('Report not found','err');return;}
  const r=await DB.upd('report',id,{resolved:true,resolved_at:new Date().toISOString()});
  if(r){rep.resolved=true;rep.resolved_at=new Date().toISOString();refreshBadge();toast('✓ Resolved','ok');rReports();}
  else toast('Failed to resolve — check Supabase RLS','err');
}

// ══════════════════════════
// REFERRALS
// ══════════════════════════
let _refFilter='all', _refSearch='';
function rReferrals(){
  const earners=D.users.filter(u=>(u.referral_count||0)>0||(u.referral_earnings||0)>0);
  const totalCredited=D.referrals.reduce((s,r)=>s+(r.amount||0),0);
  const totalRedeemed=D.referrals.filter(r=>r.redeemed).reduce((s,r)=>s+(r.amount||0),0);
  const pendingPay=totalCredited-totalRedeemed;
  const readyUsers=D.users.filter(u=>(u.referral_earnings||0)>=3000).length;
  let data=D.users.filter(u=>(u.referral_count||0)>0||(u.referral_earnings||0)>0);
  if(_refSearch) data=data.filter(u=>(u.nick||'').toLowerCase().includes(_refSearch)||(u.email||'').toLowerCase().includes(_refSearch)||(u.phone||'').includes(_refSearch));
  if(_refFilter==='ready') data=data.filter(u=>(u.referral_earnings||0)>=3000);
  if(_refFilter==='earning') data=data.filter(u=>(u.referral_earnings||0)>0&&(u.referral_earnings||0)<3000);

  setP(`
  <div class="tb">
    <div class="tb-l"><div class="ttl">Referral Management</div><div class="sub">Monitor and redeem user referral earnings</div></div>
    <div class="tb-r">
      <div class="sw"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="si" placeholder="Search user…" value="${esc(_refSearch)}" oninput="_refSearch=this.value;rReferrals()"/>
      </div>
      <button class="btn-s" onclick="loadAll().then(rReferrals)"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>Refresh</button>
    </div>
  </div>
  <div class="sg" style="grid-template-columns:repeat(4,1fr)">
    <div class="sc"><div class="sc-top"><span class="sc-lbl">Total Credited</span></div><div class="sc-val tgr">${fmt(totalCredited)}</div><div class="sc-sub">${D.referrals.length} conversions</div></div>
    <div class="sc"><div class="sc-top"><span class="sc-lbl">Total Redeemed</span></div><div class="sc-val">${fmt(totalRedeemed)}</div><div class="sc-sub">paid out</div></div>
    <div class="sc"><div class="sc-top"><span class="sc-lbl">Pending Payout</span></div><div class="sc-val" style="color:var(--amber)">${fmt(pendingPay)}</div><div class="sc-sub">owed to users</div></div>
    <div class="sc"><div class="sc-top"><span class="sc-lbl">Ready to Redeem</span></div><div class="sc-val tr_">${readyUsers}</div><div class="sc-sub">users at ₦3k+</div></div>
  </div>
  <div class="tabs">
    <button class="tab ${_refFilter==='all'?'on':''}" onclick="_refFilter='all';rReferrals()">All Earners (${earners.length})</button>
    <button class="tab ${_refFilter==='ready'?'on':''}" onclick="_refFilter='ready';rReferrals()">Ready to Redeem (${readyUsers})</button>
    <button class="tab ${_refFilter==='earning'?'on':''}" onclick="_refFilter='earning';rReferrals()">Still Earning</button>
  </div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>User</th><th>Contact</th><th>Referrals</th><th>Balance</th><th>Redeemed</th><th>Actions</th></tr></thead>
    <tbody>
      ${data.length===0?'<tr><td colspan="6"><div class="empty"><p>No referral earners yet</p></div></td></tr>':''}
      ${data.map(u=>{
        const bal=u.referral_earnings||0;
        const refs=D.referrals.filter(r=>r.referrer_id===u.id);
        const redeemedAmt=refs.filter(r=>r.redeemed).reduce((s,r)=>s+(r.amount||0),0);
        return `<tr>
          <td><div class="tw_">${esc(u.nick||'—')}</div><div class="mono td_" style="font-size:9px">${(u.referral_code||u.id.slice(0,8)).toUpperCase()}</div></td>
          <td class="td_" style="font-size:11px">${esc(u.email||'+234'+(u.phone||'—'))}</td>
          <td><span class="bge bge-b">${u.referral_count||0}</span></td>
          <td><span class="mono tw_" style="color:${bal>=3000?'var(--amber)':bal>0?'var(--green)':'var(--ink3)'}">${fmt(bal)}</span></td>
          <td class="td_">${redeemedAmt>0?fmt(redeemedAmt):'—'}</td>
          <td><div class="acts"><button class="ab" onclick="openUserReferrals('${u.id}')">Manage</button></div></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div></div>`);
}
function openUserReferrals(uid){
  const u=D.users.find(x=>x.id===uid); if(!u)return;
  const refs=D.referrals.filter(r=>r.referrer_id===uid);
  const bal=u.referral_earnings||0;
  const totalRedeemed=refs.filter(r=>r.redeemed).reduce((s,r)=>s+(r.amount||0),0);
  function renderRefRows(){
    return refs.length===0?'<div class="td_" style="font-size:11px;padding:12px 0">No referral earnings yet.</div>':
      refs.map((r)=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:${r.redeemed?'var(--bg3)':'var(--bg4)'};border-radius:var(--r);margin-bottom:6px;border:1px solid var(--br)">
        <div><div style="font-size:12px;font-weight:700;color:${r.redeemed?'var(--ink3)':'var(--ink)'}">${esc(r.referred_nick||'A user')}</div>
          <div style="font-size:10px;color:var(--ink3);margin-top:2px">Became agent · ${ago(r.created_at)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-family:'DM Mono',monospace;font-weight:700;color:${r.redeemed?'var(--ink3)':'var(--green)'}">+${fmt(r.amount||1000)}</span>
          ${r.redeemed?`<span class="bge bge-gy">Redeemed ${r.redeemed_at?ds(r.redeemed_at):''}</span>`:
            `<button class="ab ab-gr" onclick="redeemSingle('${uid}','${r.id}',${r.amount||1000})">Redeem</button>`}
        </div>
      </div>`).join('');
  }
  oM('Referrals — '+esc(u.nick||u.email||'User'),`
    <div class="ph"><div class="pav">${(u.nick||'?').charAt(0).toUpperCase()}</div>
      <div><div class="pn">${esc(u.nick||'—')}</div><div class="pc">${esc(u.email||'+234'+(u.phone||'—'))}</div>
        <div class="pbadges" style="margin-top:6px">
          <span class="bge bge-gr">Balance: ${fmt(bal)}</span>
          <span class="bge bge-gy">Redeemed: ${fmt(totalRedeemed)}</span>
          ${bal>=3000?'<span class="bge bge-a">⚡ Redeem Ready</span>':''}
        </div>
      </div>
    </div>
    <div style="font-size:10px;color:var(--ink3);margin-bottom:10px">Click <strong>Redeem</strong> on individual referrals below after manually paying the user. Their balance reduces accordingly.</div>
    <div id="ref-rows-${uid}">${renderRefRows()}</div>
  `,`<button class="mb_ mb-p" onclick="cM()">Done</button>`);
}
async function redeemSingle(uid,refId,amount){
  const u=D.users.find(x=>x.id===uid);
  const ref=D.referrals.find(r=>r.id==refId);
  if(!u||!ref)return;
  const r=await DB.upd('referral_earning',refId,{redeemed:true,redeemed_at:new Date().toISOString()});
  if(!r){toast('Failed to update — try again','err');return;}
  const newBal=Math.max(0,(u.referral_earnings||0)-amount);
  await DB.upd('user',uid,{referral_earnings:newBal});
  ref.redeemed=true; ref.redeemed_at=new Date().toISOString(); u.referral_earnings=newBal;
  toast('✓ Redeemed '+fmt(amount)+' from '+esc(u.nick||'user')+' · Balance: '+fmt(newBal),'ok');
  const rowEl=document.getElementById('ref-rows-'+uid);
  if(rowEl){
    const refs2=D.referrals.filter(r=>r.referrer_id===uid);
    rowEl.innerHTML=refs2.length===0?'<div class="td_" style="font-size:11px;padding:12px 0">No referral earnings yet.</div>':
      refs2.map(r=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:${r.redeemed?'var(--bg3)':'var(--bg4)'};border-radius:var(--r);margin-bottom:6px;border:1px solid var(--br)">
        <div><div style="font-size:12px;font-weight:700;color:${r.redeemed?'var(--ink3)':'var(--ink)'}">${esc(r.referred_nick||'A user')}</div>
          <div style="font-size:10px;color:var(--ink3);margin-top:2px">Became agent · ${ago(r.created_at)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-family:'DM Mono',monospace;font-weight:700;color:${r.redeemed?'var(--ink3)':'var(--green)'}">+${fmt(r.amount||1000)}</span>
          ${r.redeemed?`<span class="bge bge-gy">Redeemed ${r.redeemed_at?ds(r.redeemed_at):''}</span>`:
            `<button class="ab ab-gr" onclick="redeemSingle('${uid}','${r.id}',${r.amount||1000})">Redeem</button>`}
        </div>
      </div>`).join('');
    document.querySelectorAll('.pbadges .bge-gr').forEach(el=>{if(el.textContent.startsWith('Balance'))el.textContent='Balance: '+fmt(newBal);});
    document.querySelectorAll('.pbadges .bge-gy').forEach(el=>{if(el.textContent.startsWith('Redeemed'))el.textContent='Redeemed: '+fmt(D.referrals.filter(r=>r.referrer_id===uid&&r.redeemed).reduce((s,r)=>s+(r.amount||0),0));});
  }
  refreshBadge();
}

</script>
